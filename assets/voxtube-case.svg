<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">VoxTube — From launch noise to sharper research</title>
  <desc id="desc">Real Ferrari Luce case: 75 public comments. A positive machine label concealed criticism. Inspect the wording, then ask a better research question. Editorial case illustration, not an application screenshot.</desc>
  <rect width="1200" height="560" rx="24" fill="#101d29"/>
  <circle cx="1122" cy="65" r="175" fill="#163238"/>
  <path d="M1005 32v32m14-43v54m14-35v38m14-65v82m14-60v42m14-48v56m14-36v16" stroke="#63d7bb" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="61" fill="#7ee3c6" font-size="23" font-weight="700" letter-spacing="3">VOXTUBE</text>
    <text x="54" y="135" fill="#ffffff" font-size="47" font-weight="700">From launch noise</text>
    <text x="54" y="190" fill="#ffffff" font-size="47" font-weight="700">to sharper research.</text>
    <text x="56" y="234" fill="#bdccd6" font-size="22">Ferrari Luce · 75 real public comments · local AI + analyst judgment</text>
    <rect x="54" y="275" width="348" height="192" rx="14" fill="#20313f"/>
    <rect x="426" y="275" width="348" height="192" rx="14" fill="#20313f"/>
    <rect x="798" y="275" width="348" height="192" rx="14" fill="#24463f"/>
    <text x="78" y="312" fill="#b5c6d1" font-size="16" font-weight="700" letter-spacing="1">01 / MACHINE LABEL</text>
    <text x="78" y="357" fill="#7ee3c6" font-size="31" font-weight="700">Positive.</text>
    <text x="78" y="398" fill="#e3ebf0" font-size="20">A first-pass label.</text>
    <text x="78" y="428" fill="#e3ebf0" font-size="20">Not the whole meaning.</text>
    <text x="450" y="312" fill="#b5c6d1" font-size="16" font-weight="700" letter-spacing="1">02 / READ THE EVIDENCE</text>
    <text x="450" y="357" fill="#ffcf99" font-size="31" font-weight="700">Actually, criticism.</text>
    <text x="450" y="398" fill="#e3ebf0" font-size="20">Sarcasm and comparison</text>
    <text x="450" y="428" fill="#e3ebf0" font-size="20">change the interpretation.</text>
    <text x="822" y="312" fill="#b0e0d0" font-size="16" font-weight="700" letter-spacing="1">03 / RESEARCH QUESTION</text>
    <text x="822" y="357" fill="#ffffff" font-size="31" font-weight="700">What is behind it?</text>
    <text x="822" y="398" fill="#e3ebf0" font-size="20">Separate design, technology</text>
    <text x="822" y="428" fill="#e3ebf0" font-size="20">and brand distinctiveness.</text>
    <text x="56" y="511" fill="#b5c6d1" font-size="18">One self-selected discussion. Not verified buyers or representative market research.</text>
    <text x="56" y="540" fill="#849aa9" font-size="15">Case illustration, not an app screenshot · Petr Shovoldaev / Consumer &amp; market insights</text>
  </g>
</svg>
